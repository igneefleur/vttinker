# Le site de VTTinker.
#
# Les pages sont en anglais : l'extension l'est aussi par défaut, et Roll20
# l'est. Le code et ses commentaires restent en français.
#
# « docs_dir: site » et non « docs » : le dossier « docs/ » est réservé à la
# documentation de développement, qui n'est pas publiée.
#
# « site_dir: .site » commence par un point pour être ignoré par git. Il est
# poussé tel quel sur la branche gh-pages.

site_name: VTTinker
site_description: A Roll20 extension. Zoom range, grid beyond the page, custom token markers, chat footer fixes. Firefox and Chrome.
site_author: igneefleur
site_url: https://igneefleur.github.io/vttinker/
docs_dir: site
site_dir: .site

repo_url: https://github.com/igneefleur/vttinker
repo_name: igneefleur/vttinker
edit_uri: ""

copyright: All rights reserved. The code is readable; it is not open source.

theme:
  name: material
  language: en
  # LA POLICE EST CELLE DE ROLL20, et le site est fait pour être lu à côté.
  # « Proxima Nova » d'abord — beaucoup l'ont déjà — puis un équivalent qui se
  # charge partout. On ne laisse pas le navigateur choisir : une extension qui
  # se fond dans Roll20 mérite un site qui lui ressemble.
  font:
    text: Nunito Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    # LES TROIS ÉTATS, comme dans l'extension : le système décide, et l'on peut
    # passer outre. Le panneau de réglages tient exactement la même règle.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system

extra_css:
  - styles/vttinker.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Install: index.md
  - Features: modules.md
  - FAQ: questions.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/igneefleur/vttinker
      name: Source
